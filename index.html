function parseReference(raw){
  if(!raw) return null;
  const m = raw.trim().match(/^(\d?\s?[A-Za-z][A-Za-z\s]*?)\.?\s+(\d+)\s*(?::\s*(\d+)\s*(?:[-–]\s*(\d+))?)?\s*$/);
  if(!m) return null;
  const chapter = parseInt(m[2], 10);
  const vStart = m[3] ? parseInt(m[3], 10) : null;
  const vEnd = m[4] ? parseInt(m[4], 10) : null;
  const key = m[1].toLowerCase().replace(/\./g, "").replace(/\s+/g, " ").trim();
  let book = BOOK_ALIASES[key];
  if(!book){
    const compact = key.replace(/\s+/g, "");
    book = BOOKS.find(b => b.toLowerCase().replace(/\s+/g, "") === compact) || null;
  }
  if(!book) return null;
  return { book, chapter, vStart, vEnd };
}

function formatVerseHTML(book, chapter, vStart, vEnd){
  const chapterArr = BIBLE && BIBLE[book] && BIBLE[book][chapter - 1];
  if(!chapterArr) return null;
  const numTag = n => `<sup style="font-size:10px; color:var(--ink-faint); margin-right:2px;">${n}</sup>`;
  if(vStart == null){
    return chapterArr.map((t, i) => numTag(i + 1) + escapeHtml(t)).join(" ");
  }
  const end = vEnd || vStart;
  const out = [];
  for(let v = vStart; v <= end; v++){
    if(chapterArr[v - 1]) out.push(numTag(v) + escapeHtml(chapterArr[v - 1]));
  }
  return out.length ? out.join(" ") : null;
}

// Deterministically picks one item from an array based on a seed string, so the
// same week/vocation always gets the same pick, but different weeks/vocations vary —
// this is what keeps the no-Claude-account fallback content from repeating verbatim.
function seededPick(arr, seed){
  let hash = 0;
  for(let i=0;i<seed.length;i++){ hash = (hash * 31 + seed.charCodeAt(i)) >>> 0; }
  return arr[hash % arr.length];
}

function fmtDate(d){
  // Local calendar date, not UTC — toISOString() would shift the date back a day
  // for anyone in a positive UTC offset (e.g. British Summer Time) around midnight.
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

// The 7-day cycle starts on whatever day someone first opens their Reading Log —
// not the calendar week — and rolls over to a fresh "Day 1" once 7 days have passed.
function ensureCycle(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = fmtDate(today);

  // If a cycle is open but nothing has actually been logged in it yet, keep sliding
  // its start forward to today — so "Day 1" always lands on the day the user first
  // logs a passage, not the day they merely opened the app.
  if(state.cycleStart && state.cycleStart !== todayStr){
    const openLog = state.log[state.cycleStart];
    const hasAnyLogged = openLog && Object.values(openLog).some(arr => arr && arr.length);
    if(!hasAnyLogged){
      delete state.log[state.cycleStart];
      state.cycleStart = todayStr;
      saveState();
      return;
    }
  }

  if(!state.cycleStart){
    state.cycleStart = todayStr;
    saveState();
    return;
  }

  const start = new Date(state.cycleStart + "T00:00:00");
  const diffDays = Math.round((today - start) / 86400000);
  if(diffDays >= 7 || diffDays < 0){
    state.cycleStart = todayStr;
    saveState();
  }
}
function getWeekDates(){
  ensureCycle();
  const start = new Date(state.cycleStart + "T00:00:00");
  const dates = [];
  for(let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); dates.push(d); }
  return dates;
}
function weekKey(){ ensureCycle(); return state.cycleStart; }
function dayLabel(d, idx){ return "Day " + (idx+1); }
function monthDay(d){ return d.toLocaleDateString("en-GB",{month:"short", day:"numeric"}); }

function currentWeekLog(){
  const k = weekKey();
  if(!state.log[k]) state.log[k] = {};
  return state.log[k];
}

// Rooted reaches Claude through the viewer's own Claude account. `claude.use`
// resolves to null outside Claude, so every AI feature has a fallback.
const claudeUse = (name) => (window.claude && typeof window.claude.use === "function")
  ? window.claude.use(name).catch(() => null)
  : Promise.resolve(null);

const BLOCKING_CODES = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
let sampleBlocked = false;

async function askClaude(prompt, tier){
  const sample = await samplePromise;
  if(!sample || sampleBlocked) return null;
  try {
    const { text } = await sample(prompt, { modelTier: tier || "default", cache: false });
    return text ? text.trim() : null;
  } catch(e){
    if(e && BLOCKING_CODES.includes(e.code)) sampleBlocked = true;
    console.warn("sample() failed", e && e.code);
    return null;
  }
}

// Works whether or not the viewer has a Claude account: tries the artifact
// download capability first, falls back to a plain browser download so this
// never depends on an AI/account feature.
async function saveFile(filename, data, mime){
  const downloads = await downloadsPromise;
  if(downloads){
    try {
      await downloads.save({ filename, data });
      toast("Saved " + filename);
      return;
    } catch(e){
      if(e && e.code === "declined"){ toast("Download cancelled."); return; }
      /* otherwise fall through to a plain browser download */
    }
  }
  try {
    const blob = new Blob([data], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    toast("Downloaded " + filename);
  } catch(e){
    toast("Couldn't download — try again.");
  }
}

}

function restoreBackup(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch(err){ toast("That file doesn't look like a Rooted backup."); return; }
    if(!parsed || typeof parsed !== "object" || !("log" in parsed) || !("vocationId" in parsed)){
      toast("That file doesn't look like a Rooted backup.");
      return;
    }
    state = Object.assign({ name:"", vocationId:"finance", log:{}, themeHistory:[], reflections:{}, notifyMe:false, readRefs:{} }, parsed);
    ensureCompanionState();
    saveState();
    buildSections();
    bindFoundationEvents();
    bindLogEvents();
    bindCommunityEvents();
    updateSidebarIdentity();
    switchSection("foundation");
    toast("Backup restored.");
  };
  reader.onerror = () => toast("Couldn't read that file.");
  reader.readAsText(file);
}

let addingDayKey = null;

function bindLogEvents(){
  document.getElementById("sec-log").querySelectorAll("[data-add-day]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      addingDayKey = btn.dataset.addDay;
      rerenderLog();
      const input = document.getElementById("addPassageInput");
      if(input) input.focus();
    });
  });
  const confirmBtn = document.getElementById("sec-log").querySelector("[data-confirm-add]");
  if(confirmBtn){
    confirmBtn.addEventListener("click", ()=> confirmAddPassage(confirmBtn.dataset.confirmAdd));
  }
  const cancelBtn = document.getElementById("sec-log").querySelector("[data-cancel-add]");
  if(cancelBtn){
    cancelBtn.addEventListener("click", ()=>{ addingDayKey = null; rerenderLog(); });
  }
  const input = document.getElementById("addPassageInput");
  if(input){
    input.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); confirmAddPassage(addingDayKey); }
      if(e.key === "Escape"){ addingDayKey = null; rerenderLog(); }
    });
  }
  document.getElementById("sec-log").querySelectorAll("[data-remove]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const [day, idx] = el.dataset.remove.split(":");
      currentWeekLog()[day].splice(Number(idx),1);
      saveState();
      rerenderLog();
    });
  });
  document.getElementById("sec-log").querySelectorAll("[data-verse-ref]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.dataset.remove) return;
      const ref = el.dataset.verseRef;
      openVerse(ref);
      if(el.classList.contains("foundation-chip") && !state.readRefs[ref]){
        state.readRefs[ref] = true;
        saveState();
        el.classList.remove("foundation-chip"); // avoid double-marking before rerender
        el.style.background = "var(--accent-3-soft)";
        el.style.color = "var(--accent-3-ink)";
        el.textContent = "✓ " + ref;
      }
    });
  });
  const markBtn = document.getElementById("markFoundationRead");
  if(markBtn) markBtn.addEventListener("click", ()=>{
    const v = getVocation(state.vocationId);
    const key = fmtDate(new Date());
    const log = currentWeekLog();
    if(!log[key]) log[key] = [];
    v.refs.forEach(ref=>{ if(!log[key].some(p=>p.ref===ref)) log[key].push({ref}); });
    saveState();
    rerenderLog();
    toast("Marked as read.");
  });
  document.getElementById("seeThemeBtn").addEventListener("click", ()=> switchSection("theme"));
  document.getElementById("sec-log").querySelectorAll("[data-companion-add]").forEach(b=>{
    b.addEventListener("click", ()=> addSuggestionToToday(b.dataset.companionAdd));
  });
  document.getElementById("sec-log").querySelectorAll("[data-go-companion]").forEach(b=>{
    b.addEventListener("click", ()=> switchSection("companion"));
  });
}

function rerenderLog(){
  document.getElementById("sec-log").innerHTML = renderLogHTML();
  bindLogEvents();
}

function confirmAddPassage(dayKey){
  const input = document.getElementById("addPassageInput");
  const ref = input ? input.value.trim() : "";
  if(!ref){ if(input) input.focus(); return; }
  const log = currentWeekLog();
  if(!log[dayKey]) log[dayKey] = [];
  log[dayKey].push({ ref });
  saveState();
  addingDayKey = null;
  rerenderLog();
  toast(`Logged ${ref}.`);
}

async function openVerse(ref){
  const verseTextEl = document.getElementById("verseText");
  document.getElementById("verseRef").textContent = ref;
  document.getElementById("verseFullLink").href = bgLink(ref);
  verseTextEl.textContent = "Loading…";
  document.getElementById("verseOverlay").classList.add("active");

  await bibleReadyPromise; // resolves once the bundled Bible JSON has loaded (or failed)

  const parsed = parseReference(ref);
  if(BIBLE && parsed){
    const html = formatVerseHTML(parsed.book, parsed.chapter, parsed.vStart, parsed.vEnd);
    if(html){ verseTextEl.innerHTML = html; return; }
  }
  const cached = VERSES[ref];
  if(cached){ verseTextEl.textContent = "“" + cached + "”"; return; }
  verseTextEl.textContent = bibleLoadFailed
    ? "We couldn't load the full Bible text just now — try the link below instead."
    : "We couldn't match that reference — try the format \"Book Chapter:Verse\" (e.g. \"John 3:16\"), or read it below.";
}
function closeVerse(){ document.getElementById("verseOverlay").classList.remove("active"); }
document.getElementById("verseOverlay").addEventListener("click", (e)=>{ if(e.target.id==="verseOverlay") closeVerse(); });

async function generateTheme(){
  const passages = allPassagesThisWeek();
  const v = getVocation(state.vocationId);
  const card = document.getElementById("themeCard");
  card.innerHTML = `<span style="font-size:13px; color:var(--ink-faint);">Thinking it over…</span>`;

  const prompt = `You are helping someone reflect on their week of Bible reading. They work in ${v.name}. This week they logged these passages: ${passages.join("; ")}.
Write a short, warm, non-preachy "theme" for their week in this exact format (no extra commentary):
TITLE: <a short, evocative 3-7 word theme title>
SUMMARY: <2-3 sentences, encouraging tone, tying the passages together into one idea, gently connecting it to their vocation>`;

  let title, summary;
  const completion = await askClaude(prompt, "default");
  if(completion){
    const tMatch = completion.match(/TITLE:\s*(.+)/i);
    const sMatch = completion.match(/SUMMARY:\s*([\s\S]+)/i);
    title = tMatch ? tMatch[1].trim() : "This week's thread";
    summary = sMatch ? sMatch[1].trim() : completion.trim();
  } else {
    const wk0 = weekKey();
    const tpl = seededPick(THEME_FALLBACK_TEMPLATES, wk0 + state.vocationId);
    title = tpl.title;
    summary = tpl.frame(passages.join(", ") || "this week's reading");
  }

  const wk = weekKey();
  state.themeHistory = state.themeHistory.filter(t=>t.weekKey!==wk);
  state.themeHistory.push({ weekKey: wk, title, summary, generatedAt: Date.now() });
  saveState();
  card.innerHTML = themeCardInner({title, summary});
  bindThemeRegenerate();
}

async function generateChallenge(theme){
  const v = getVocation(state.vocationId);
  const card = document.getElementById("challengeCard");
  card.innerHTML = `<span style="font-size:13px; color:var(--ink-faint);">Thinking it over…</span>`;

  const prompt = `Someone works in ${v.name}. Their reading is anchored in ${v.refShort}. ${theme ? `This week's theme is "${theme.title}": ${theme.summary}` : ""}
Write ONE short, concrete, practical action they could try this week at work — not a reflection question, an actual small action. Format exactly:
TITLE: <a short imperative title, under 6 words>
BODY: <1-2 sentences describing the specific action>
VERSE: <one short scripture reference that supports it>`;

  let title, body, footer;
  const completion = await askClaude(prompt, "default");
  if(completion){
    const t = completion.match(/TITLE:\s*(.+)/i);
    const b = completion.match(/BODY:\s*(.+)/i);
    const vs = completion.match(/VERSE:\s*(.+)/i);
    title = t ? t[1].trim() : "Try this today.";
    body = b ? b[1].trim() : completion.trim();
    footer = vs ? vs[1].trim() : "";
  } else {
    title = "Try this today.";
    const options = CHALLENGE_FALLBACKS[state.vocationId] || CHALLENGE_FALLBACKS.finance;
    body = seededPick(options, weekKey() + state.vocationId);
    footer = v.refShort;
  }

  const wk = weekKey();
  state.reflections[wk].challenge = { title, body, footer };
  saveState();
  card.innerHTML = challengeInner(state.reflections[wk]);
  bindChallengeDoneToggle();
}

function renderGrowth(){
  const el = document.getElementById("sec-growth");
  const history = [...state.themeHistory].sort((a,b)=> a.weekKey.localeCompare(b.weekKey));

async function generateArc(history){
  const el = document.getElementById("sec-growth");
  const card = el.querySelector(".card");
  card.innerHTML = `<span style="font-size:13px; color:var(--ink-faint);">Looking back over your weeks…</span>`;
  const v = getVocation(state.vocationId);
  const themesText = history.map(t=>`${t.weekKey}: ${t.title} — ${t.summary}`).join("\n");

  const prompt = `Someone has been logging weekly Bible-study themes while working in ${v.name}. Here is their theme history, oldest first:
${themesText}
Write a short, warm, encouraging monthly "growth arc" narrative (4-6 sentences) that notices any recurring thread across these weeks and frames it as a personal story of formation, not a performance score. Format exactly:
TITLE: <a short, warm title for this arc, e.g. "Your September Arc">
NARRATIVE: <the narrative>`;

  let title, narrative;
  const completion = await askClaude(prompt, "default");
  if(completion){
    const t = completion.match(/TITLE:\s*(.+)/i);
    const n = completion.match(/NARRATIVE:\s*([\s\S]+)/i);
    title = t ? t[1].trim() : "Your arc so far";
    narrative = n ? n[1].trim() : completion.trim();
  } else {
    const tpl = seededPick(GROWTH_FALLBACK_TEMPLATES, weekKey() + state.vocationId + history.length);
    title = tpl.title;
    narrative = tpl.frame(history.map(t=>t.title).join(", "));
  }

  state.growthArc = { title, narrative, count: history.length, generatedAt: Date.now() };
  saveState();
  card.innerHTML = arcCardInner(state.growthArc);
}

/* ============================= COMPANION (the agent) ============================= */
// This is what makes the companion an agent rather than a single prompt: Claude is
// given a goal and a set of tools (the page functions below). Claude decides which
// tools to call and in what order, reads what they return, and only then writes.

let companionRun = null;          // the check-in in progress: { steps, suggestion, reviewKey, ctl, trigger }
let companionUnavailable = false; // Claude can't be reached from this view
let companionError = "";

function ensureCompanionState(){
  if(!state.companion || typeof state.companion !== "object") state.companion = {};
  if(!Array.isArray(state.companion.notes)) state.companion.notes = [];
}
ensureCompanionState();

function latestCompanionNote(){ ensureCompanionState(); return state.companion.notes[0] || null; }

function companionHasNews(){
  if(companionRun) return true;
  const n = latestCompanionNote();
  return !!(n && state.companion.seenNoteId !== n.id);
}
function markCompanionSeen(){
  const n = latestCompanionNote();
  if(n && state.companion.seenNoteId !== n.id){ state.companion.seenNoteId = n.id; saveState(); }
}

// The most recent finished 7-day cycle that has at least one logged passage.
function previousWeekKey(){
  const cur = weekKey();
  const keys = Object.keys(state.log)
    .filter(k => k < cur && Object.values(state.log[k] || {}).some(a => a && a.length))
    .sort();
  return keys.length ? keys[keys.length - 1] : null;
}

function weekSummary(key){
  const days = state.log[key] || {};
  const start = new Date(key + "T00:00:00");
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = fmtDate(d);
    out.push({ day:"Day " + (i+1), date:k, passages:(days[k] || []).map(p => p.ref) });
  }
  return { weekStarting:key, daysWithReading: out.filter(d => d.passages.length).length, days: out };
}

function recentLoggedRefs(weeks){
  const refs = [];
  Object.keys(state.log).sort().slice(-weeks).forEach(k =>
    Object.values(state.log[k] || {}).forEach(arr => (arr || []).forEach(p => refs.push(p.ref))));
  return refs;
}

// Plain KJV text for a reference, from the Bible bundled with Rooted.
function passageText(ref){
  const parsed = parseReference(ref);
  if(!parsed) return { error:"Couldn't read that reference. Use the form 'Book Chapter:Verse-Verse', for example 'Proverbs 16:1-9'." };
  if(!BIBLE) return { error:"The Bible text hasn't loaded." };
  const chapterArr = BIBLE[parsed.book] && BIBLE[parsed.book][parsed.chapter - 1];
  if(!chapterArr) return { error:`${parsed.book} ${parsed.chapter} isn't in the Bible text.` };
  const start = parsed.vStart || 1;
  if(start > chapterArr.length) return { error:`${parsed.book} ${parsed.chapter} has only ${chapterArr.length} verses.` };
  const end = Math.min(parsed.vEnd || (parsed.vStart ? parsed.vStart : chapterArr.length), chapterArr.length);
  const verses = [];
  for(let v = start; v <= end && verses.length < 40; v++) verses.push(v + " " + chapterArr[v - 1]);
  let text = verses.join(" ");
  if(text.length > 3500) text = text.slice(0, 3500) + " …";
  const label = `${parsed.book} ${parsed.chapter}` + (parsed.vStart ? `:${start}` + (end > start ? `-${end}` : "") : "");
  return { reference: label, text, versesInChapter: chapterArr.length };
}

const WHICH_WEEK_SCHEMA = {
  type:"object",
  properties:{ which:{ type:"string", enum:["last_week","this_week"], description:"last_week = the most recent finished week; this_week = the week in progress" } },
  required:["which"]
};

// The tools Claude can choose from. Each one is a small, safe page function:
// five only read, and one (suggest_passage) saves a single suggestion.
function companionTools(ctx){
  const v = getVocation(state.vocationId);
  const step = (text) => { ctx.steps.push(text); renderCompanionLive(); };
  const keyFor = (input) => String(input && input.which) === "this_week" ? weekKey() : ctx.reviewKey;
  return [
    {
      name:"get_profile",
      description:"Returns the reader's first name, their vocation, the foundation passages Rooted anchors that vocation in, and today's date. Call this first.",
      execute(){
        step("Checked your name and vocation");
        return { name: state.name || null, vocation: v.name, foundationPassages: v.refs, foundationTheme: v.blurb, today: fmtDate(new Date()) };
      }
    },
    {
      name:"get_reading_log",
      description:"Returns the passages the reader logged, day by day, for last_week or this_week, and how many days had reading.",
      inputSchema: WHICH_WEEK_SCHEMA,
      execute(input){
        const key = keyFor(input);
        step(String(input && input.which) === "this_week" ? "Read this week's reading log" : "Read last week's reading log");
        if(!key) return { note:"There is no finished week on record yet." };
        return weekSummary(key);
      }
    },
    {
      name:"get_journal",
      description:"Returns what the reader wrote in their private journal for last_week or this_week, plus that week's practical challenge and whether they marked it done. It is personal: handle it with care.",
      inputSchema: WHICH_WEEK_SCHEMA,
      execute(input){
        const key = keyFor(input);
        step(String(input && input.which) === "this_week" ? "Read this week's journal" : "Read last week's journal");
        const r = key && state.reflections ? state.reflections[key] : null;
        if(!r || (!r.journal && !r.challenge)) return { note:"Nothing was written in the journal that week." };
        return {
          journal: (r.journal || "").slice(0, 4000) || null,
          challenge: r.challenge ? `${r.challenge.title}: ${r.challenge.body}` : null,
          challengeDone: !!r.challengeDone
        };
      }
    },
    {
      name:"get_theme_history",
      description:"Returns the reader's past weekly themes (up to 8, oldest first) and the passages they logged over the last six weeks. Use it to spot recurring threads and to avoid suggesting something they just read.",
      execute(){
        step("Looked back over your past themes");
        const themes = [...state.themeHistory].sort((a,b) => a.weekKey.localeCompare(b.weekKey)).slice(-8)
          .map(t => ({ week:t.weekKey, title:t.title, summary:t.summary }));
        return { themes, recentPassages: recentLoggedRefs(6).slice(-60) };
      }
    },
    {
      name:"lookup_passage",
      description:"Returns the King James text of a passage (up to 40 verses) from the Bible bundled in Rooted. Reference format: 'Book Chapter:Verse-Verse', e.g. 'Nehemiah 2:1-8'. Read a passage before you recommend it.",
      inputSchema:{ type:"object", properties:{ reference:{ type:"string" } }, required:["reference"] },
      async execute(input){
        await bibleReadyPromise;
        const ref = String(input && input.reference || "").slice(0, 80);
        const r = passageText(ref);
        step(r.error ? `Tried to look up ${ref}` : `Read ${r.reference}`);
        if(r.error) throw new Error(r.error);
        return r;
      }
    },
    {
      name:"suggest_passage",
      description:"Saves ONE passage as the reader's suggested reading for the coming week, with a one- or two-sentence reason tied to their vocation. Call it exactly once, after reading the passage. Calling it again replaces the earlier pick.",
      inputSchema:{ type:"object", properties:{ reference:{ type:"string" }, reason:{ type:"string" } }, required:["reference","reason"] },
      async execute(input){
        await bibleReadyPromise;
        const r = passageText(String(input && input.reference || "").slice(0, 80));
        if(r.error) throw new Error(r.error);
        ctx.suggestion = { ref: r.reference, reason: String(input.reason || "").slice(0, 400) };
        step(`Picked ${r.reference} for your week ahead`);
        return { saved:true, reference:r.reference };
      }
    }
  ];
}

function companionBrief(ctx){
  const v = getVocation(state.vocationId);
  const weekWord = ctx.reviewKey ? "last_week" : "this_week (there is no finished week yet)";
  return `You are the study companion inside Rooted, an app where someone reads the Bible alongside their working life. Once a week you check in with them. Be warm, plain-spoken and encouraging. Never be preachy, and never make them feel guilty about missed days.

Your job right now:
1. Find out how their week went. Use the tools to look; don't guess. Start with get_profile, then read their reading log and journal for ${weekWord}. Check their theme history for threads that keep coming back.
2. Choose ONE passage for the coming week, from a few verses up to one chapter, that speaks to their vocation (${v.name}) and connects to what you noticed. Avoid passages they read in the last few weeks. Read it with lookup_passage first, then save it with suggest_passage, exactly once.
3. Adapt to how the week went. If they read on most days, build on that momentum. If they read little or nothing, be gracious and keep the suggestion short.

The journal is private. Refer to it gently and briefly, and never quote more than a few words of it. If it suggests they are going through something hard, acknowledge that with care and encourage them to talk with someone they trust.

When you are done, reply with only this JSON:
{"title": "a 3-7 word title for their week ahead", "message": "3-5 sentences written directly to them${state.name ? ` (their name is ${state.name})` : ""}: what you noticed about their week and why the suggested passage fits", "noticed": "one short sentence naming the pattern or thread you saw"}`;
}

function companionErrorCopy(code){
  if(code === "rate_limited") return "You've reached your Claude usage limit for now. Try the check-in again later.";
  if(code === "session_expired") return "Sign in to Claude again, then try the check-in.";
  if(code === "refused" || code === "empty_completion" || code === "invalid_json") return "The check-in didn't come together this time. Try again.";
  return "Rooted couldn't reach Claude just now. Try the check-in again in a moment.";
}

async function runCompanion(trigger){
  if(companionRun) return;
  ensureCompanionState();
  companionError = "";
  const sample = await samplePromise;
  const limits = sample && !sampleBlocked ? await sample.limits().catch(() => null) : null;
  if(!limits || !limits.tools){ companionUnavailable = true; renderCompanion(); return; }

  const ctx = { steps:[], suggestion:null, reviewKey: previousWeekKey(), ctl: new AbortController(), trigger };
  companionRun = ctx;
  state.companion.lastAttemptAt = Date.now();
  saveState();
  renderCompanion(); renderNav();

  try {
    const result = await sample.json(companionBrief(ctx), { tools: companionTools(ctx), signal: ctx.ctl.signal, modelTier:"default" });
    const str = (x) => typeof x === "string" ? x.trim() : "";
    if(!ctx.suggestion){
      const v = getVocation(state.vocationId);
      ctx.suggestion = { ref: v.full, reason: `A passage from your foundation for ${v.name}.` };
    }
    const note = {
      id: String(Date.now()),
      createdAt: Date.now(),
      weekKey: weekKey(),
      reviewedWeek: ctx.reviewKey,
      trigger,
      title: str(result && result.title) || "Your week ahead",
      message: str(result && result.message),
      noticed: str(result && result.noticed),
      suggestion: ctx.suggestion,
      suggestionStatus: "open",
      steps: ctx.steps.slice(0, 20)
    };
    state.companion.notes.unshift(note);
    state.companion.notes = state.companion.notes.slice(0, 12);
    state.companion.lastRunAt = Date.now();
    if(ctx.reviewKey) state.companion.lastReviewed = ctx.reviewKey;
    if(activeSection === "companion") state.companion.seenNoteId = note.id;
    saveState();
    if(activeSection !== "companion") toast("Your weekly check-in is ready.");
  } catch(e){
    const code = e && e.code;
    if(BLOCKING_CODES.includes(code) || code === "tools_unavailable"){ sampleBlocked = true; companionUnavailable = true; }
    else if(code !== "cancelled"){ companionError = companionErrorCopy(code); }
  } finally {
    companionRun = null;
    renderCompanion(); renderNav();
    if(activeSection === "log") rerenderLog();
  }
}

// Runs once a week on its own: when a finished week hasn't been reviewed yet, or a
// week has gone by since the last check-in. At most one automatic try a day.
function companionDue(){
  ensureCompanionState();
  const c = state.companion;
  if(c.lastAttemptAt && Date.now() - c.lastAttemptAt < 20 * 3600 * 1000) return false;
  const prev = previousWeekKey();
  if(prev && (!c.lastReviewed || prev > c.lastReviewed)) return true;
  if(c.lastRunAt && Date.now() - c.lastRunAt >= 7 * 86400000) return true;
  return false;
}
async function maybeAutoRunCompanion(){
  if(!companionDue()) return;
  const sample = await samplePromise;
  if(!sample) return;
  if(activeSection === "foundation") switchSection("companion");
  runCompanion("auto");
}

function addSuggestionToToday(noteId){
  const note = state.companion.notes.find(n => n.id === noteId);
  if(!note || !note.suggestion) return;
  const key = fmtDate(new Date());
  const log = currentWeekLog();
  if(!log[key]) log[key] = [];
  if(!log[key].some(p => p.ref === note.suggestion.ref)) log[key].push({ ref: note.suggestion.ref });
  note.suggestionStatus = "added";
  saveState();
  toast(`Added ${note.suggestion.ref} to today's reading.`);
  rerenderLog();
  if(activeSection === "companion") renderCompanion();
}
function skipSuggestion(noteId){
  const note = state.companion.notes.find(n => n.id === noteId);
  if(!note) return;
  note.suggestionStatus = "skipped";
  saveState();
  rerenderLog();
  if(activeSection === "companion") renderCompanion();
}

function fmtNoteDate(ts){
  try { return new Date(ts).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }); }
  catch(e){ return ""; }
}

  if(!n || !n.suggestion || n.suggestionStatus !== "open") return "";
  return `
    <div class="card" style="background:var(--accent-3-soft); border:none; display:flex; flex-direction:column; gap:10px;">
      <div class="eyebrow" style="color:var(--accent-3-ink);">From your companion</div>
      <div><button class="chip" data-verse-ref="${escapeHtml(n.suggestion.ref)}" style="font-weight:600; background:var(--surface); color:var(--accent-3-ink);">${escapeHtml(n.suggestion.ref)}</button></div>
      ${n.suggestion.reason ? `<div class="suggest-reason">${escapeHtml(n.suggestion.reason)}</div>` : ""}
      <div class="row-wrap">
        <button class="btn btn-primary" data-companion-add="${n.id}" style="font-size:13px; padding:8px 14px;">Add to today's reading</button>
        <button class="btn btn-ghost" data-go-companion style="font-size:13px; padding:8px 14px;">Read the check-in</button>
      </div>
    </div>`;
}

/* ============================= SECTION: RESOURCES ============================= */

function renderResources(){
  const el = document.getElementById("sec-resources");
  const v = getVocation(state.vocationId);
  const data = RESOURCES[v.id];

  el.innerHTML = `
    <div class="serif" style="font-size:26px; font-weight:600;">Go deeper</div>
    <div style="font-size:13px; color:var(--ink-faint);">Additional reading and mentors for ${escapeHtml(v.name)}.</div>
    ${data ? `
      <div style="display:flex; flex-direction:column; gap:12px;">
        ${data.books.map(b=>`
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:16px;">
            <div>
              <div style="font-weight:600; font-size:14px;">${escapeHtml(b.title)}</div>
              <div style="font-size:12px; color:var(--ink-faint); margin:2px 0 6px;">${escapeHtml(b.author)}</div>
              <div style="font-size:13px; color:var(--ink-soft); line-height:1.5;">${escapeHtml(b.blurb)}</div>
            </div>
            <a href="${b.link}" target="_blank" rel="noopener" class="btn btn-ghost" style="font-size:12px; flex-shrink:0;">View book →</a>
          </div>`).join("")}
      </div>
      <div>
        <div style="font-weight:500; font-size:14px; margin-bottom:10px;">Mentors &amp; communities</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${data.mentors.map(m=>`
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:600; font-size:14px;">${escapeHtml(m.name)}</div>
                <div style="font-size:13px; color:var(--ink-soft);">${escapeHtml(m.desc)}</div>
              </div>
              <a href="${m.link}" target="_blank" rel="noopener" class="btn btn-ghost" style="font-size:12px;">Visit →</a>
            </div>`).join("")}
        </div>
      </div>
    ` : `
      <div class="card" style="text-align:center; padding:40px 20px;">
        <div style="font-weight:600; margin-bottom:6px;">Coming soon for ${escapeHtml(v.name)}</div>
        <p style="font-size:13px; color:var(--ink-soft); max-width:420px; margin:0 auto;">We haven't put together a list for this vocation yet. Check back soon.</p>
      </div>
    `}
    <div class="footer">Created by Raphael Apata</div>
  `;
}

/* ============================= SECTION: COMMUNITY ============================= */

function renderCommunityHTML(){
  return `
    <div class="serif" style="font-size:26px; font-weight:600;">Community</div>
    <span class="chip" style="background:var(--accent-2-soft); color:var(--accent-2-ink); cursor:default;">Upcoming feature</span>
    <div class="card" style="text-align:center; padding:48px 24px;">
      <div style="font-weight:600; font-size:16px; margin-bottom:8px;">Want to share your experience?</div>
      <p style="font-size:13px; color:var(--ink-soft); max-width:420px; margin:0 auto 18px;">Soon you'll be able to share what God is teaching you with others on the same journey — by vocation, by season, or just to encourage someone else.</p>
      <button class="btn ${state.notifyMe ? 'btn-ghost' : 'btn-primary'}" id="notifyBtn">${state.notifyMe ? "✓ We'll let you know" : "Notify me when this launches"}</button>
    </div>
    <div class="footer">Created by Raphael Apata</div>
  `;
}
function bindCommunityEvents(){
  document.getElementById("notifyBtn").addEventListener("click", ()=>{
    state.notifyMe = true;
    saveState();
    document.getElementById("sec-community").innerHTML = renderCommunityHTML();
    bindCommunityEvents();
    toast("We'll let you know!");
  });
}

/* ============================= BOOT ============================= */

function buildSections(){
  const container = document.getElementById("sections");
  const wrap = (id, inner) => `<div class="section ${id==='foundation'?'active':''} ${id==='log'?'wide':''}" id="sec-${id}">${inner}</div>`;
  container.innerHTML =
    wrap("foundation", renderFoundationHTML()) +
    wrap("companion", "") +
    wrap("log", renderLogHTML()) +
    wrap("theme", "") +
    wrap("reflect", "") +
    wrap("growth", "") +
    wrap("resources", "") +
    wrap("community", renderCommunityHTML());
}

function init(){
  renderNav();
  buildSections();
  bindFoundationEvents();
  bindLogEvents();
  bindCommunityEvents();
  updateSidebarIdentity();
  document.getElementById("hamburgerBtn").addEventListener("click", openSidebar);
  document.getElementById("sidebarBackdrop").addEventListener("click", closeSidebar);
  maybeAutoRunCompanion();
}
init();
</script>

</body></html>
